<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F3F5"><title>Ficou Pronto | Técnico</title><link rel="stylesheet" href="/premium-flow.css?v=7"><style>.tech-wrap{max-width:900px;margin:0 auto;padding:20px 16px 72px}.tech-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tech-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tech-tag{font-size:12px;color:#37578b;background:#FFF1EA;padding:6px 10px;border-radius:999px}.tech-camera{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0;align-items:end}.tech-card{margin-bottom:14px}.tech-actions{display:flex;flex-wrap:wrap;gap:8px}.tech-note{color:#4B5563;font-size:13px;line-height:1.55}button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:650px){.tech-grid,.tech-form,.tech-camera{grid-template-columns:1fr}.tech-camera{border-bottom:1px solid #E5E7EB;padding-bottom:16px}.tech-head{align-items:flex-start}}</style></head><body><main class="tech-wrap"><header class="tech-head"><div><div class="nv-eyebrow">Ficou Pronto · Operação técnica</div><h1>Instalações</h1></div><button id="logout" class="nv-button secondary" hidden>Sair</button></header><section id="loginPanel" class="nv-card" style="max-width:480px"><h2>Acesso do técnico</h2><p class="tech-note">Entre com sua conta técnica. As instalações são liberadas pelo administrador.</p><form id="loginForm"><label class="nv-field">E-mail<input name="email" type="email" required autocomplete="username"></label><label class="nv-field">Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="nv-button">Entrar</button><p id="loginStatus" role="status"></p></form></section><section id="techApp" hidden><div class="nv-card"><h2>Ordens de instalação</h2><p class="tech-note">Selecione uma loja atribuída. Equipamentos e alterações ficam restritos à instalação autorizada.</p><div id="assignments">Carregando…</div></div><section id="details" class="nv-card" style="margin-top:18px" hidden></section></section></main><script>
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch])),cap=s=>{s=String(s??'').trim();return s?s[0].toLocaleUpperCase('pt-BR')+s.slice(1):s};
let token=sessionStorage.getItem('nv_technician_token')||'',current=null;
async function api(path,method='GET',body){const r=await fetch('/api'+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Falha ao carregar');return j}
function signedIn(){ $('loginPanel').hidden=true;$('techApp').hidden=false;$('logout').hidden=false;loadAssignments() }
$('loginForm').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.currentTarget);try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:d.get('email'),password:d.get('password')})});const j=await r.json();if(!r.ok)throw Error(j.error||'Não foi possível entrar');if(j.user.role!=='technician')throw Error('Esta área é exclusiva para técnicos autorizados');token=j.token;sessionStorage.setItem('nv_technician_token',token);signedIn()}catch(err){$('loginStatus').textContent=err.message}};
$('logout').onclick=()=>{sessionStorage.removeItem('nv_technician_token');location.reload()};
async function loadAssignments(){try{const data=await api('/technician/assignments');$('assignments').innerHTML=data.length?data.map(a=>'<article class="nv-order tech-card"><div><strong>'+safe(cap(a.store))+'</strong><p>'+safe(a.notes||'Sem observações')+'</p><span class="tech-tag">'+safe(a.status==='completed'?'Concluída':a.status==='in_progress'?'Em instalação':'Aguardando')+'</span><p>'+a.camera_count+' / '+a.camera_limit+' câmera(s) autorizada(s)</p></div><button class="nv-button secondary" data-assignment="'+safe(a.id)+'">Abrir</button></article>').join(''):'<p class="tech-note">Nenhuma instalação atribuída ainda.</p>';document.querySelectorAll('[data-assignment]').forEach(b=>b.onclick=()=>openAssignment(data.find(a=>a.id===b.dataset.assignment)))}catch(err){$('assignments').textContent=err.message}}
async function openAssignment(a){current=a;const d=$('details');d.hidden=false;d.innerHTML='<h2>'+safe(cap(a.store))+'</h2><p class="tech-note">Carregando equipamentos…</p>';try{const cameras=await api('/technician/assignments/'+a.id+'/cameras');d.innerHTML='<div class="nv-heading"><h2>'+safe(cap(a.store))+'</h2><span class="tech-tag">'+safe(a.status)+'</span></div><p class="tech-note">A configuração de stream e NVR ainda requer validação técnica. O estado “Pronta” abaixo é apenas uma anotação de instalação física, não comprovação de vídeo remoto.</p><div class="tech-actions"><button class="nv-button secondary" id="startWork" '+(a.status==='completed'?'disabled':'')+'>Iniciar instalação</button><button class="nv-button" id="finishWork" '+(a.status==='completed'?'disabled':'')+'>Concluir checklist</button></div><h3>Equipamentos</h3><div id="cameras">'+(cameras.map(c=>'<form class="tech-camera" data-camera="'+safe(c.id)+'"><label class="nv-field">Nome<input name="name" required value="'+safe(c.name)+'"></label><label class="nv-field">Estação<input name="station" value="'+safe(c.station||'')+'"></label><label class="nv-field">Estado<select name="status">'+['unconfigured','testing','ready','offline'].map((s,i)=>'<option value="'+s+'" '+(c.status===s?'selected':'')+'>'+['Não configurada','Em teste','Instalada','Offline'][i]+'</option>').join('')+'</select></label><label><input type="checkbox" name="enabled" '+(c.enabled?'checked':'')+'> Liberar câmera nesta instalação</label><button class="nv-button secondary" '+(a.status==='completed'?'disabled':'')+'>Salvar</button><button type="button" class="nv-button secondary" data-replace-tech="'+safe(c.id)+'" '+(a.status==='completed'?'disabled':'')+'>Trocar equipamento</button><button type="button" class="nv-button secondary" data-remove-tech="'+safe(c.id)+'" '+(a.status==='completed'?'disabled':'')+'>Remover</button><p role="status"></p></form>').join('')||'<p class="tech-note">Nenhuma câmera cadastrada.</p>')+'</div><h3>Adicionar câmera</h3><form id="newCamera" class="tech-form"><label class="nv-field">Nome<input name="name" required placeholder="Câmera do balcão"></label><label class="nv-field">Estação<input name="station" placeholder="Balcão 01"></label><button class="nv-button" '+(a.status==='completed'?'disabled':'')+'>Cadastrar equipamento</button><p id="cameraStatus" role="status"></p></form>';
 d.querySelectorAll('[data-camera]').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const d=new FormData(form);try{await api('/technician/assignments/'+a.id+'/cameras/'+form.dataset.camera,'PATCH',{name:String(d.get('name')).trim(),station:String(d.get('station')).trim(),status:d.get('status'),enabled:d.get('enabled')==='on'});form.querySelector('[role=status]').textContent='Salvo'}catch(err){form.querySelector('[role=status]').textContent=err.message}});
 d.querySelectorAll('[data-remove-tech]').forEach(button=>button.onclick=async()=>{if(!confirm('Remover esta câmera da instalação? O histórico será preservado.'))return;try{await api('/technician/assignments/'+a.id+'/cameras/'+button.dataset.removeTech,'DELETE');await openAssignment(a);await loadAssignments()}catch(err){$('cameraStatus').textContent=err.message}});
 d.querySelectorAll('[data-replace-tech]').forEach(button=>button.onclick=async()=>{if(!confirm('Iniciar troca e bloquear a transmissão até a configuração e liberação do equipamento substituto?'))return;try{await api('/technician/assignments/'+a.id+'/cameras/'+button.dataset.replaceTech,'PATCH',{replacement:true});await openAssignment(a)}catch(err){$('cameraStatus').textContent=err.message}});
 $('newCamera').onsubmit=async e=>{e.preventDefault();const x=new FormData(e.currentTarget);try{await api('/technician/assignments/'+a.id+'/cameras','POST',{name:String(x.get('name')).trim(),station:String(x.get('station')).trim()});await openAssignment(a);await loadAssignments()}catch(err){$('cameraStatus').textContent=err.message}};
 for(const [id,status] of [['startWork','in_progress'],['finishWork','completed']])$(id).onclick=async()=>{try{await api('/technician/assignments/'+a.id,'PATCH',{status});await loadAssignments();$('details').hidden=true}catch(err){d.querySelector('.tech-note').textContent=err.message}};
}catch(err){d.textContent=err.message}}
(async()=>{if(!token)return;try{const me=await api('/me');if(me.role!=='technician')throw Error('Sem permissão');signedIn()}catch{sessionStorage.removeItem('nv_technician_token');token=''}})();
</script></body></html>
