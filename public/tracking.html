:root{font-family:"DM Sans",system-ui,sans-serif;color:#172b4d;background:#f7f9fd}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{background:#fff;border-bottom:1px solid #e6ebf3}.header-inner{max-width:740px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font:800 17px "Plus Jakarta Sans",sans-serif;color:#172b4d;letter-spacing:-.05em}.brandmark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#2563eb;color:white;margin-right:7px}.secure{font-size:12px;color:#6b7891}main{max-width:740px;margin:28px auto 60px;padding:0 16px}.surface{background:#fff;border:1px solid #e6ebf3;border-radius:20px;padding:25px;box-shadow:0 12px 35px #172b4d07}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#8190a7}h1,h2,h3{font-family:"Plus Jakarta Sans",sans-serif;letter-spacing:-.04em}h1{font-size:clamp(25px,5vw,35px);margin:8px 0 16px}h2{font-size:21px;margin:0}h3{font-size:17px;margin:24px 0 13px}.muted{color:#6e7b91}p{line-height:1.55}.merchant{display:flex;align-items:center;gap:13px;margin:15px 0 24px}.merchant-logo{height:48px;width:48px;border-radius:13px;object-fit:contain;background:#edf3ff;padding:5px}.merchant-symbol{height:48px;width:48px;border-radius:13px;display:grid;place-items:center;background:#eaf2ff;color:#2563eb;font-weight:800}.merchant h2{font-size:18px;margin:0}.merchant p{font-size:13px;margin:4px 0 0}.status{background:linear-gradient(135deg,#edf4ff,#f8faff);border:1px solid #dce7fb;border-radius:16px;padding:19px;margin:18px 0}.status-label{font-size:12px;font-weight:700;color:#5774a2}.status-value{font:750 clamp(20px,4vw,26px) "Plus Jakarta Sans",sans-serif;margin:8px 0 14px;letter-spacing:-.04em}.bar{height:10px;background:#dfe9f8;border-radius:99px;overflow:hidden}.bar div{height:100%;background:#2563eb;border-radius:inherit;transition:width .35s}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.small{font-size:12px}.steps{list-style:none;padding:0 0 0 10px;margin:20px 0}.steps li{border-left:2px solid #e5eaf3;padding:0 0 24px 29px;position:relative}.steps li:last-child{border-color:transparent;padding-bottom:4px}.steps li:before{content:"";position:absolute;left:-11px;top:0;width:18px;height:18px;border:2px solid #c1ccdc;border-radius:50%;background:#fff}.steps li.done:before{background:#16a34a;border-color:#16a34a}.steps li.active:before{background:#2563eb;border-color:#2563eb;box-shadow:0 0 0 4px #e2edff}.step-name{font-weight:700;font-size:14px}.step-meta{font-size:12px;color:#7b8798;margin-top:4px}.media{border:1px dashed #cbd8eb;border-radius:15px;padding:21px;background:#f7f9fd;display:flex;gap:12px;align-items:center}.media-icon{background:#e7eefb;border-radius:11px;padding:12px;font-size:20px}.media strong{font-size:14px}.media p{font-size:12px;color:#748197;margin:5px 0 0}.loyalty{background:#f7f4ff;border:1px solid #e6dcff;padding:18px;border-radius:16px;margin-top:22px}.loyalty h3{margin:0 0 9px}.loyalty .bar{background:#e5ddfa}.loyalty .bar div{background:#7958d8}button{font:700 13px "DM Sans",sans-serif;border:1px solid #d6e1f0;border-radius:11px;min-height:44px;padding:10px 15px;background:white;color:#2257a5;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb;color:white}button:disabled{opacity:.5}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;color:#7d8a9e;font-size:12px}details{margin-top:16px;font-size:13px}summary{cursor:pointer;font-weight:700}.coupon{border:1px dashed #9e88df;border-radius:12px;background:#fff;padding:13px;margin-top:12px}.coupon code{font-size:21px;font-weight:800;letter-spacing:.12em}.error{border-radius:13px;background:#fff2f2;border:1px solid #fecaca;color:#9d2525;padding:18px}@media(max-width:520px){main{margin:14px auto 30px;padding:0 10px}.surface{padding:18px;border-radius:16px}.header-inner{padding:14px 16px}.toolbar{align-items:stretch;flex-direction:column}.toolbar button{width:100%}.media{align-items:start}}
 .step-panel{border:1px solid #e5eaf3;border-radius:13px;padding:0 14px;margin:9px 0;background:#fff}.step-panel[open]{border-color:#c9dafa;background:#fbfdff}.step-panel summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:14px 0;gap:12px}.step-panel summary::-webkit-details-marker{display:none}.step-panel summary:after{content:'⌄';color:#71809a;font-size:18px}.step-panel[open] summary:after{content:'⌃'}.step-body{padding:0 0 16px}.step-video{background:#f1f5fc;border:1px dashed #d3dded;border-radius:12px;padding:15px;font-size:13px;color:#687a92}.step-video video{width:100%;border-radius:10px;background:#172b4d}.step-meta{margin:0}.step-download{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:#245fd0} .steps{padding:0;margin:8px 0;list-style:none}.steps li{padding:0;border:0}.steps li:before{display:none} </style></head><body><header><div class="header-inner"><div class="logo"><span class="brandmark">◉</span>NextVision</div><span class="secure">Acompanhamento individual</span></div></header><main><div class="surface"><div class="eyebrow">Seu pedido, passo a passo</div><h1>Acompanhe seu pedido</h1><div id="content" aria-live="polite">Carregando informações…</div></div><div class="toolbar"><span id="updated">Atualização automática a cada 15 segundos</span><button id="refresh">Atualizar agora</button></div></main><script>
const content=document.getElementById('content'),updated=document.getElementById('updated'),refresh=document.getElementById('refresh');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>{s=String(s??'').trim();return s?s[0].toLocaleUpperCase('pt-BR')+s.slice(1):s};
const token=location.pathname.split('/').filter(Boolean).pop();
const statusLabels={queued:'Seu pedido está na fila',live:'Em atendimento',paused:'Atendimento pausado',completed:'Pedido finalizado'};
let updating=false,lastHtml='',lastStepKey='';const openSteps=new Set();
const currentLabel=p=>p.status==='live'?cap((p.steps||[])[p.step_index]||'Em atendimento'):statusLabels[p.status]||'Em atualização';
function render(p){
 const steps=Array.isArray(p.steps)?p.steps:[],done=p.status==='completed'?steps.length:Math.max(0,Math.min(steps.length,Number(p.step_index)||0));
 const percent=steps.length?Math.round(done/steps.length*100):0;
 const loyalty=!!p.loyalty_enabled&&p.loyalty_checkins!==null&&p.loyalty_checkins!==undefined;
 const history=Array.isArray(p.loyalty_history)?p.loyalty_history:[];
 const claimable=loyalty&&Number(p.loyalty_checkins)>=Number(p.loyalty_target)&&!history.some(h=>h.status==='issued');
 return '<div class="merchant">'+(p.logo_url?'<img class="merchant-logo" alt="Logo da loja" src="'+safe(p.logo_url)+'">':'<span class="merchant-symbol">◉</span>')+'<div><h2>'+safe(cap(p.store||'Estabelecimento'))+'</h2><p class="muted">'+(p.external_reference?'Pedido #'+safe(p.external_reference)+' · ':'')+safe(cap(p.process||'Serviço'))+'</p></div></div>'+
 '<section class="status"><div class="status-label">Situação atual</div><div class="status-value">'+safe(currentLabel(p))+'</div>'+(p.status==='queued'&&Number(p.queue_position)>0?'<p class="small muted">Posição na fila: '+Number(p.queue_position)+'</p>':'')+'<div class="bar" role="progressbar" aria-label="Etapas concluídas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+percent+'"><div style="width:'+percent+'%"></div></div><div class="between small muted" style="margin-top:8px"><span>Progresso do serviço</span><span>'+done+' de '+steps.length+' etapas</span></div></section>'+
 '<h3>Etapas do atendimento</h3><ol class="steps">'+steps.map((step,i)=>{const finished=p.status==='completed'||i<done,active=p.status!=='completed'&&i===Number(p.step_index);const record=(p.recordings||[]).find(r=>Number(r.step_index)===i&&r.status==='ready'&&r.download_url);return '<li><details class="step-panel" data-step="'+i+'" '+(active?'open':'')+'><summary><span><span class="step-name">'+(i+1)+'. '+safe(cap(step))+'</span><span class="step-meta" style="display:block">'+(finished?'Concluída':active?p.status==='live'?'Em andamento':p.status==='paused'?'Pausada':'Aguardando início':'Aguardando')+'</span></span><span class="small muted">'+(finished?'✓':active?'●':'○')+'</span></summary><div class="step-body"><div class="step-video">'+(record?'<video controls preload="metadata" src="'+safe(record.download_url)+'"></video><a class="step-download" href="'+safe(record.download_url)+'" download>Baixar vídeo da etapa</a>':active&&p.status==='live'?'<video class="nv-live-player" data-live="1" muted autoplay playsinline controls preload="none"></video><div class="small muted nv-live-message" role="status">Ao vivo · carregando vídeo autorizado…</div>':'Nenhuma gravação disponível para esta etapa.')+'</div></div></details></li>'}).join('')+'</ol>'+
 (loyalty?'<section class="loyalty"><h3>★ Sua fidelidade</h3><p class="small">Você tem <strong>'+Number(p.loyalty_checkins)+'</strong> check-in(s) disponíveis de <strong>'+Number(p.loyalty_target)+'</strong> necessários.</p><div class="bar"><div style="width:'+Math.min(100,Math.round(Number(p.loyalty_checkins)/Math.max(1,Number(p.loyalty_target))*100))+'%"></div></div><p class="small">Recompensa: '+safe(p.loyalty_reward||'Benefício da loja')+'</p>'+(claimable?'<button class="primary" id="claim">Solicitar recompensa</button>':'')+'<div id="couponArea"></div><details><summary>Histórico de recompensas</summary>'+(history.length?history.map(h=>'<p class="small">'+safe(h.reward)+' · '+(h.status==='redeemed'?'Resgatada':'Cupom emitido')+' · '+new Date(h.issued_at).toLocaleDateString('pt-BR')+'</p>').join(''):'<p class="small">Nenhuma recompensa solicitada até agora.</p>')+'</details></section>':'');
}
let hlsPlayer=null,liveVideo=null,liveRetryTimer=null,liveGeneration=0,liveRetryDelay=5000,liveFailed=false,hlsLibraryPromise=null;
let liveProgress={generation:0,frames:null,time:0,at:Date.now()};
setInterval(()=>{
 const video=liveVideo;
 if(!video||!video.isConnected||document.hidden||liveFailed)return;
 const frames=video.getVideoPlaybackQuality?.().totalVideoFrames??null;
 if(liveProgress.generation!==liveGeneration||video.seeking||(video.paused&&!video.ended&&video.readyState>=2)){
  liveProgress={generation:liveGeneration,frames,time:video.currentTime,at:Date.now()};return;
 }
 const progressed=frames===null?video.currentTime>liveProgress.time:frames>liveProgress.frames;
 if(progressed){liveProgress={generation:liveGeneration,frames,time:video.currentTime,at:Date.now()};return;}
 if(Date.now()-liveProgress.at>15000){if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null;}retryLive(video,'A imagem parou de receber novos quadros.');}
},3000);
const liveMessage=(video,text)=>{const node=video.parentElement?.querySelector('.nv-live-message');if(node)node.textContent=text;};
function retryLive(video,message){
 liveFailed=true;
 if(!video.isConnected)return;
 const delay=liveRetryDelay;liveRetryDelay=Math.min(30000,delay*2);
 liveMessage(video,message+' Reconectando em '+Math.round(delay/1000)+' segundos…');
 clearTimeout(liveRetryTimer);
 liveRetryTimer=setTimeout(()=>{liveRetryTimer=null;if(video.isConnected&&!document.hidden)void setupLivePlayer();},delay);
}
async function setupLivePlayer(){
 const video=content.querySelector('video.nv-live-player'),generation=++liveGeneration;
 clearTimeout(liveRetryTimer);liveRetryTimer=null;
 if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null}
 if(liveVideo){liveVideo.onerror=null;liveVideo.onplaying=null;liveVideo.onended=null;if(liveVideo!==video){liveVideo.pause();liveVideo.removeAttribute('src');liveVideo.load();}}
 liveVideo=video;liveFailed=false;
 if(!video)return;
 const src='/api/public/orders/'+encodeURIComponent(token)+'/live/index.m3u8';
 liveMessage(video,'Conectando à transmissão autorizada…');
 video.onended=()=>{if(generation===liveGeneration)retryLive(video,'A transmissão foi interrompida.');};
 video.onplaying=()=>{if(generation===liveGeneration){liveRetryDelay=5000;liveFailed=false;liveMessage(video,'Ao vivo');}};
 if(video.canPlayType('application/vnd.apple.mpegurl')){
  video.onerror=()=>{if(generation===liveGeneration)retryLive(video,'Transmissão temporariamente indisponível.');};
  video.src=src;video.play().catch(()=>{});return;
 }
 if(!window.Hls){
  if(!hlsLibraryPromise)hlsLibraryPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js';script.onload=resolve;script.onerror=()=>{script.remove();hlsLibraryPromise=null;reject(Error('Player unavailable'));};document.head.appendChild(script);});
  try{await hlsLibraryPromise}catch{if(generation===liveGeneration)retryLive(video,'Não foi possível carregar o player.');return;}
 }
 if(!video.isConnected||generation!==liveGeneration)return;
 if(!window.Hls?.isSupported()){liveMessage(video,'Reprodução de vídeo não suportada neste navegador.');return;}
 const player=new Hls({enableWorker:true,lowLatencyMode:true});hlsPlayer=player;
 player.on(Hls.Events.MANIFEST_PARSED,()=>{if(generation===liveGeneration)video.play().catch(()=>{});});
 player.on(Hls.Events.FRAG_BUFFERED,()=>{if(generation===liveGeneration){liveMessage(video,'Ao vivo');liveRetryDelay=5000;}});
 player.on(Hls.Events.ERROR,(_event,data)=>{
  if(generation!==liveGeneration)return;
  if(!data.fatal){if(data.type===Hls.ErrorTypes.NETWORK_ERROR)liveMessage(video,'Conexão instável. Reconectando…');return;}
  const status=data.response?.code||data.networkDetails?.status||0;
  const message=status===404?'Aguardando câmera autorizada.':status===409?'Câmera ocupada por outro pedido.':status===503?'Transmissão ainda não configurada.':status===502?'Origem do vídeo indisponível.':status===429?'Aguardando liberação de novas requisições.':'Conexão de vídeo interrompida.';
  player.destroy();if(hlsPlayer===player)hlsPlayer=null;retryLive(video,message);
 });
 player.loadSource(src);player.attachMedia(video);
}
function showCoupon(){const v=sessionStorage.getItem('nv_coupon_'+token),area=document.getElementById('couponArea');if(!v||!area)return;area.innerHTML='<div class="coupon"><div class="small muted">Apresente este código à loja</div><code>'+safe(v)+'</code><p class="small muted">Guarde o cupom até a validação.</p></div>'}
async function load(){if(updating||document.hidden)return;updating=true;refresh.disabled=true;try{const r=await fetch('/api/public/orders/'+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)throw Error(r.status===404?'Pedido não encontrado. Confira o link recebido.':'Não foi possível consultar este pedido.');const p=await r.json(),html=render(p);if(html!==lastHtml){content.innerHTML=html;lastHtml=html;void setupLivePlayer();const key=p.status+':'+p.step_index;if(key!==lastStepKey){lastStepKey=key;openSteps.clear();if(p.status!=='completed')openSteps.add(Number(p.step_index));content.querySelectorAll('.step-panel').forEach(el=>{el.open=Number(el.dataset.step)===Number(p.step_index)&&p.status!=='completed'})}else{content.querySelectorAll('.step-panel').forEach(el=>{el.open=openSteps.has(Number(el.dataset.step))})}const claim=document.getElementById('claim');if(claim)claim.onclick=async()=>{claim.disabled=true;try{const result=await fetch('/api/public/orders/'+encodeURIComponent(token)+'/loyalty/claim',{method:'POST'});const data=await result.json();if(!result.ok)throw Error(data.error||'Não foi possível solicitar a recompensa');sessionStorage.setItem('nv_coupon_'+token,data.code);showCoupon()}catch(e){claim.insertAdjacentHTML('afterend','<p class="error">'+safe(e.message)+'</p>');claim.disabled=false}};showCoupon();content.querySelectorAll('.step-panel').forEach(el=>el.addEventListener('toggle',()=>{const i=Number(el.dataset.step);if(el.open)openSteps.add(i);else openSteps.delete(i)}))}updated.textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · atualização automática a cada 15 segundos'}catch(e){if(!lastHtml)content.innerHTML='<div class="error">'+safe(e.message)+'</div>';updated.textContent='Falha na atualização. Tente novamente.'}finally{updating=false;refresh.disabled=false}}
refresh.addEventListener('click',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();if(liveFailed&&liveVideo?.isConnected)void setupLivePlayer();}});load();setInterval(load,15000);
</script></body></html>
