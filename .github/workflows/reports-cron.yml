# Acorda o servidor no horário dos relatórios por e-mail e pede o envio do que estiver pendente.
# O servidor também tem um agendador interno; este ping garante o envio mesmo se o Render estiver dormindo.
# Horários em UTC (Fortaleza = UTC-3): diário/mensal 18:00–18:50 local, semanal sábado 15:00–15:50 local.
name: reports-cron
on:
  schedule:
    - cron: '*/10 21 * * *'
    - cron: '*/10 18 * * 6'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar relatórios pendentes
        env:
          URL: ${{ vars.REPORTS_URL || 'https://nextvision-mgx6.onrender.com' }}
          KEY: ${{ secrets.REPORTS_CRON_KEY }}
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 -X POST "$URL/api/internal/reports/run" ${KEY:+-H "x-cron-key: $KEY"}; then exit 0; fi
            sleep 20
          done
          exit 1
