<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fd"><title>Acompanhe seu pedido | NextVision</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:"DM Sans",system-ui,sans-serif;color:#172b4d;background:#f7f9fd}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{background:#fff;border-bottom:1px solid #e6ebf3}.header-inner{max-width:740px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font:800 17px "Plus Jakarta Sans",sans-serif;color:#172b4d;letter-spacing:-.05em}.brandmark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#2563eb;color:white;margin-right:7px}.secure{font-size:12px;color:#6b7891}main{max-width:740px;margin:28px auto 60px;padding:0 16px}.surface{background:#fff;border:1px solid #e6ebf3;border-radius:20px;padding:25px;box-shadow:0 12px 35px #172b4d07}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#8190a7}h1,h2,h3{font-family:"Plus Jakarta Sans",sans-serif;letter-spacing:-.04em}h1{font-size:clamp(25px,5vw,35px);margin:8px 0 16px}h2{font-size:21px;margin:0}h3{font-size:17px;margin:24px 0 13px}.muted{color:#6e7b91}p{line-height:1.55}.merchant{display:flex;align-items:center;gap:13px;margin:15px 0 24px}.merchant-logo{height:48px;width:48px;border-radius:13px;object-fit:contain;background:#edf3ff;padding:5px}.merchant-symbol{height:48px;width:48px;border-radius:13px;display:grid;place-items:center;background:#eaf2ff;color:#2563eb;font-weight:800}.merchant h2{font-size:18px;margin:0}.merchant p{font-size:13px;margin:4px 0 0}.status{background:linear-gradient(135deg,#edf4ff,#f8faff);border:1px solid #dce7fb;border-radius:16px;padding:19px;margin:18px 0}.status-label{font-size:12px;font-weight:700;color:#5774a2}.status-value{font:750 clamp(20px,4vw,26px) "Plus Jakarta Sans",sans-serif;margin:8px 0 14px;letter-spacing:-.04em}.bar{height:10px;background:#dfe9f8;border-radius:99px;overflow:hidden}.bar div{height:100%;background:#2563eb;border-radius:inherit;transition:width .35s}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.small{font-size:12px}.steps{list-style:none;padding:0 0 0 10px;margin:20px 0}.steps li{border-left:2px solid #e5eaf3;padding:0 0 24px 29px;position:relative}.steps li:last-child{border-color:transparent;padding-bottom:4px}.steps li:before{content:"";position:absolute;left:-11px;top:0;width:18px;height:18px;border:2px solid #c1ccdc;border-radius:50%;background:#fff}.steps li.done:before{background:#16a34a;border-color:#16a34a}.steps li.active:before{background:#2563eb;border-color:#2563eb;box-shadow:0 0 0 4px #e2edff}.step-name{font-weight:700;font-size:14px}.step-meta{font-size:12px;color:#7b8798;margin-top:4px}.media{border:1px dashed #cbd8eb;border-radius:15px;padding:21px;background:#f7f9fd;display:flex;gap:12px;align-items:center}.media-icon{background:#e7eefb;border-radius:11px;padding:12px;font-size:20px}.media strong{font-size:14px}.media p{font-size:12px;color:#748197;margin:5px 0 0}.loyalty{background:#f7f4ff;border:1px solid #e6dcff;padding:18px;border-radius:16px;margin-top:22px}.loyalty h3{margin:0 0 9px}.loyalty .bar{background:#e5ddfa}.loyalty .bar div{background:#7958d8}button{font:700 13px "DM Sans",sans-serif;border:1px solid #d6e1f0;border-radius:11px;min-height:44px;padding:10px 15px;background:white;color:#2257a5;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb;color:white}button:disabled{opacity:.5}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;color:#7d8a9e;font-size:12px}details{margin-top:16px;font-size:13px}summary{cursor:pointer;font-weight:700}.coupon{border:1px dashed #9e88df;border-radius:12px;background:#fff;padding:13px;margin-top:12px}.coupon code{font-size:21px;font-weight:800;letter-spacing:.12em}.error{border-radius:13px;background:#fff2f2;border:1px solid #fecaca;color:#9d2525;padding:18px}@media(max-width:520px){main{margin:14px auto 30px;padding:0 10px}.surface{padding:18px;border-radius:16px}.header-inner{padding:14px 16px}.toolbar{align-items:stretch;flex-direction:column}.toolbar button{width:100%}.media{align-items:start}}
</style></head><body><header><div class="header-inner"><div class="logo"><span class="brandmark">◉</span>NextVision</div><span class="secure">Acompanhamento individual</span></div></header><main><div class="surface"><div class="eyebrow">Seu pedido, passo a passo</div><h1>Acompanhe seu pedido</h1><div id="content" aria-live="polite">Carregando informações…</div></div><div class="toolbar"><span id="updated">Atualização automática a cada 15 segundos</span><button id="refresh">Atualizar agora</button></div></main><script>
const content=document.getElementById('content'),updated=document.getElementById('updated'),refresh=document.getElementById('refresh');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>{s=String(s??'').trim();return s?s[0].toLocaleUpperCase('pt-BR')+s.slice(1):s};
const token=location.pathname.split('/').filter(Boolean).pop();
const statusLabels={queued:'Seu pedido está na fila',live:'Em atendimento',paused:'Atendimento pausado',completed:'Pedido finalizado'};
let updating=false,lastHtml='';
const currentLabel=p=>p.status==='live'?cap((p.steps||[])[p.step_index]||'Em atendimento'):statusLabels[p.status]||'Em atualização';
function render(p){
 const steps=Array.isArray(p.steps)?p.steps:[],done=p.status==='completed'?steps.length:Math.max(0,Math.min(steps.length,Number(p.step_index)||0));
 const percent=steps.length?Math.round(done/steps.length*100):0;
 const loyalty=!!p.loyalty_enabled&&p.loyalty_checkins!==null&&p.loyalty_checkins!==undefined;
 const history=Array.isArray(p.loyalty_history)?p.loyalty_history:[];
 const claimable=loyalty&&Number(p.loyalty_checkins)>=Number(p.loyalty_target)&&!history.some(h=>h.status==='issued');
 return '<div class="merchant">'+(p.logo_url?'<img class="merchant-logo" alt="Logo da loja" src="'+safe(p.logo_url)+'">':'<span class="merchant-symbol">◉</span>')+'<div><h2>'+safe(cap(p.store||'Estabelecimento'))+'</h2><p class="muted">'+(p.external_reference?'Pedido #'+safe(p.external_reference)+' · ':'')+safe(cap(p.process||'Serviço'))+'</p></div></div>'+
 '<section class="status"><div class="status-label">Situação atual</div><div class="status-value">'+safe(currentLabel(p))+'</div>'+(p.status==='queued'&&Number(p.queue_position)>0?'<p class="small muted">Posição na fila: '+Number(p.queue_position)+'</p>':'')+'<div class="bar" role="progressbar" aria-label="Etapas concluídas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+percent+'"><div style="width:'+percent+'%"></div></div><div class="between small muted" style="margin-top:8px"><span>Progresso do serviço</span><span>'+done+' de '+steps.length+' etapas</span></div></section>'+
 '<h3>Etapas do atendimento</h3><ol class="steps">'+steps.map((step,i)=>{const finished=p.status==='completed'||i<done,active=p.status!=='completed'&&i===Number(p.step_index);return '<li class="'+(finished?'done':active?'active':'')+'"><div class="step-name">'+safe(cap(step))+'</div><div class="step-meta">'+(finished?'Concluída':active?p.status==='live'?'Em andamento':p.status==='paused'?'Pausada':'Aguardando início':'Aguardando')+'</div></li>'}).join('')+'</ol>'+
 '<h3>Transmissão da etapa</h3><div class="media"><div class="media-icon">▣</div><div><strong>Vídeo ainda não disponível</strong><p>O acompanhamento visual será ativado após a instalação e integração segura das câmeras. O progresso do pedido já funciona.</p></div></div>'+
 (loyalty?'<section class="loyalty"><h3>★ Sua fidelidade</h3><p class="small">Você tem <strong>'+Number(p.loyalty_checkins)+'</strong> check-in(s) disponíveis de <strong>'+Number(p.loyalty_target)+'</strong> necessários.</p><div class="bar"><div style="width:'+Math.min(100,Math.round(Number(p.loyalty_checkins)/Math.max(1,Number(p.loyalty_target))*100))+'%"></div></div><p class="small">Recompensa: '+safe(p.loyalty_reward||'Benefício da loja')+'</p>'+(claimable?'<button class="primary" id="claim">Solicitar recompensa</button>':'')+'<div id="couponArea"></div><details><summary>Histórico de recompensas</summary>'+(history.length?history.map(h=>'<p class="small">'+safe(h.reward)+' · '+(h.status==='redeemed'?'Resgatada':'Cupom emitido')+' · '+new Date(h.issued_at).toLocaleDateString('pt-BR')+'</p>').join(''):'<p class="small">Nenhuma recompensa solicitada até agora.</p>')+'</details></section>':'');
}
function showCoupon(){const v=sessionStorage.getItem('nv_coupon_'+token),area=document.getElementById('couponArea');if(!v||!area)return;area.innerHTML='<div class="coupon"><div class="small muted">Apresente este código à loja</div><code>'+safe(v)+'</code><p class="small muted">Guarde o cupom até a validação.</p></div>'}
async function load(){if(updating||document.hidden)return;updating=true;refresh.disabled=true;try{const r=await fetch('/api/public/orders/'+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)throw Error(r.status===404?'Pedido não encontrado. Confira o link recebido.':'Não foi possível consultar este pedido.');const p=await r.json(),html=render(p);if(html!==lastHtml){content.innerHTML=html;lastHtml=html;const claim=document.getElementById('claim');if(claim)claim.onclick=async()=>{claim.disabled=true;try{const result=await fetch('/api/public/orders/'+encodeURIComponent(token)+'/loyalty/claim',{method:'POST'});const data=await result.json();if(!result.ok)throw Error(data.error||'Não foi possível solicitar a recompensa');sessionStorage.setItem('nv_coupon_'+token,data.code);showCoupon()}catch(e){claim.insertAdjacentHTML('afterend','<p class="error">'+safe(e.message)+'</p>');claim.disabled=false}};showCoupon()}updated.textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · atualização automática a cada 15 segundos'}catch(e){if(!lastHtml)content.innerHTML='<div class="error">'+safe(e.message)+'</div>';updated.textContent='Falha na atualização. Tente novamente.'}finally{updating=false;refresh.disabled=false}}
refresh.addEventListener('click',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});load();setInterval(load,15000);
</script></body></html>
