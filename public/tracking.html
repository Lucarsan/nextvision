<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F4F5F7"><title>Ficou Pronto | Acompanhe seu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--card:#FFFFFF;--ink:#16202E;--muted:#5B6576;--line:#E2E6EC;--accent:#F26B1D;--accent-ink:#C2410C;--accent-soft:#FFF1E7;--track:#F1D9C9;--ok:#15803D;--done:#16A34A;--wa:#16A34A;
--display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:14px 12px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 0}
.store{display:flex;align-items:center;gap:10px;min-width:0}
.store-mark{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;overflow:hidden}
.store-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.store b{display:block;font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.store span{font-size:13px;color:var(--muted)}
.wordmark{font-family:var(--display);font-size:14px;font-weight:800;letter-spacing:-.2px;color:var(--ink);white-space:nowrap}.wordmark .p,.wordmark .mark{color:var(--accent)}.wordmark .mark{display:inline-block}
.wordmark.done .mark{animation:pop .6s ease}@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.card{background:var(--card);border-radius:20px;padding:16px}

.sub{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--ink)}
.muted{color:var(--muted)}.small{font-size:13px}
/* Vídeo ou foto em destaque */
.hero{display:flex;flex-direction:column;gap:10px}
.media{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:4/3.4}
.media.photo{aspect-ratio:4/4.4}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.media.contain video{object-fit:contain}
.badge{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;letter-spacing:.3px;padding:5px 10px;border-radius:999px}
.badge i{width:8px;height:8px;border-radius:50%;background:#EF4444;display:block}.badge.ok{background:var(--wa)}.badge.wait i{background:#FBBF24}
.msg{position:absolute;right:12px;top:12px;max-width:55%;background:rgba(0,0,0,.55);color:#E5E7EB;font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;text-align:right}
.msg:empty{display:none}
.shade{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(to top,rgba(0,0,0,.74),rgba(0,0,0,0));color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}

.photo .shade{flex-direction:column;align-items:flex-start;gap:2px;padding-bottom:16px}.photo .shade strong{font-size:30px}.photo .shade small{font-size:14px;opacity:.9}
.pill{font-size:12px;font-weight:600;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:999px;white-space:nowrap;flex:none}
.no-video{position:absolute;inset:0;display:grid;place-items:center;padding:20px;color:#D1D5DB;font-size:14px;text-align:center}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn.dark{background:var(--ink);color:#fff}.btn.light{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.talk:focus-visible,#refresh:focus-visible,.share-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.extra-photos{display:flex;gap:8px;overflow-x:auto}.extra-photos img{width:84px;height:84px;object-fit:cover;border-radius:14px;display:block}
/* Etapas */
.status{display:flex;flex-direction:column;gap:14px}
.segs{display:grid;gap:6px}
.seg{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg b{height:6px;border-radius:3px;background:var(--line);display:block}
.seg span{font-size:12px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.seg.done b{background:var(--done)}.seg.done span{color:var(--ok)}.seg span .ck{white-space:nowrap}.seg span .ck i{font-style:normal;font-size:10px;margin-left:1px}.seg span{font-size:11.5px}.seg.cur b{background:linear-gradient(to right,var(--accent) 55%,var(--track) 55%)}
.seg.cur span{color:var(--ink);font-weight:700}.seg.paused b{background:repeating-linear-gradient(90deg,var(--accent) 0 6px,var(--track) 6px 10px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:12px;background:var(--bg);padding:5px 10px;border-radius:999px}
.state{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:5px 10px;border-radius:999px}
.state.ok{color:var(--ok);background:#ECFDF5}.state.pause{color:#374151;background:#F3F4F6}
.done-list{display:flex;flex-direction:column;gap:8px;font-size:14px}.done-list div{display:flex;justify-content:space-between;gap:10px}.done-list .last{font-weight:700}
.tl{position:relative;display:grid;text-align:center;list-style:none;margin:0;padding:0}
.tl .ln,.tl .fill{position:absolute;top:10px;height:2px;border-radius:2px}.tl .ln{background:var(--line)}.tl .fill{background:#22C55E;box-shadow:0 0 4px rgba(34,197,94,.5)}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid #D5D9E2;color:#B3BAC6}.dot svg{width:12px;height:12px}
.st.done .dot{background:#22C55E;border-color:#22C55E;color:#fff;box-shadow:0 0 5px rgba(34,197,94,.55)}
.st.cur .dot{background:#2563EB;border-color:#2563EB;color:#fff;animation:pu 1.6s infinite}
.st.cur.paused .dot{background:#F59E0B;border-color:#F59E0B;animation:none;box-shadow:0 0 5px rgba(245,158,11,.55)}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(37,99,235,.45),0 0 6px rgba(37,99,235,.6)}70%{box-shadow:0 0 0 6px rgba(37,99,235,0),0 0 6px rgba(37,99,235,.6)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0),0 0 6px rgba(37,99,235,.6)}}
.st span{font-size:11.5px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}.st.done span{color:#15803D}.st.cur span{color:var(--ink);font-weight:700}
.tl.many .dot{width:18px;height:18px}.tl.many .dot svg{width:10px;height:10px}.tl.many .ln,.tl.many .fill{top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Fila */
.queue{display:flex;align-items:center;gap:14px}
.queue .queue-num{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.queue b{display:block;font-size:15px}.queue span{font-size:13px;color:var(--muted)}
.others{border-top:1px solid var(--line);padding-top:12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.others p{margin:0}.qdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px}
/* Fidelidade */
.loyalty{display:flex;flex-direction:column;gap:10px}
.loy-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stamps{display:grid;gap:6px}
.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--card);color:#CBD2DB}
.stamp.on{background:var(--accent);border-color:var(--accent);color:#fff}.stamp svg{width:58%;height:58%}
.bar{height:8px;background:var(--bg);border-radius:999px;overflow:hidden}.bar div{height:100%;background:var(--accent);border-radius:999px}
.loyalty p{margin:0;font-size:13px;color:var(--muted)}
button.primary{min-height:46px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.coupon{background:var(--accent-soft);border-radius:12px;padding:12px}.coupon code{font-size:22px;font-weight:700;letter-spacing:2px}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}details p{font-size:13px}
/* Gravações */
.rec-item{padding:10px 0;border-top:1px solid var(--line)}.rec-item:first-of-type{border-top:0}.rec-item small{font-size:12px}
button.secondary{min-height:42px;margin-top:8px;padding:0 16px;border:1px solid var(--accent);border-radius:12px;background:var(--card);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}button.secondary:disabled{opacity:.6}
.rec-msg:empty{display:none}.rec-msg{margin:6px 0 0;color:var(--muted)}
/* Fotos de entrada e avaliação */
.arrival{display:flex;flex-direction:column;gap:8px}.arrival>span{font-size:13px;color:var(--muted);padding-left:4px}
.arrival-row{display:flex;gap:8px;overflow-x:auto}.arrival-row img{width:84px;height:84px;object-fit:cover;border-radius:14px;display:block}
.review{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink)}
.review span{display:flex;flex-direction:column}.review small{font-size:13px;color:var(--muted)}.review i{font-style:normal;font-size:18px;letter-spacing:2px;color:var(--accent)}
/* Rodapé */
.foot{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:0 2px}
#updated{font-size:12px;color:var(--muted);text-align:center}
#refresh{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
#refresh.restart{background:var(--accent);border-color:var(--accent);color:#fff}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px max(12px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(244,245,247,0))}
.dock-in{max-width:520px;margin:0 auto;display:flex;gap:8px}
.talk{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--wa);color:#fff;font-weight:700;font-size:16px;text-decoration:none}
.talk[hidden]{display:none}
.share-btn{min-width:52px;min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:0 14px}
.share-btn span{display:none}#talkStore[hidden]+.share-btn{flex:1}#talkStore[hidden]+.share-btn span{display:inline}
.error{background:#FEF2F2;color:#B91C1C;border-radius:14px;padding:14px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><div class="top"><div class="store" id="storeTop"><span class="store-mark">·</span><div><b>Carregando…</b><span>&nbsp;</span></div></div><span class="wordmark" id="wordmark" aria-label="Ficou Pronto">ficou<span class="p">pronto</span><span class="mark">?</span></span></div><div id="content" aria-live="polite" style="display:flex;flex-direction:column;gap:12px"><div class="card">Carregando informações…</div></div><div class="foot"><span id="updated">Esta página atualiza sozinha</span><button id="refresh" type="button">Atualizar agora</button></div></main>
<div class="dock"><div class="dock-in"><a id="talkStore" class="talk" hidden target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>Falar com a loja</a><button id="sharePage" class="share-btn" type="button" aria-label="Compartilhar acompanhamento"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/></svg><span>Compartilhar acompanhamento</span></button></div></div>
<script>
const content=document.getElementById('content'),updated=document.getElementById('updated'),refresh=document.getElementById('refresh');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>{s=String(s??'').trim();return s?s[0].toLocaleUpperCase('pt-BR')+s.slice(1):s};
const low=s=>String(s??'').trim().toLocaleLowerCase('pt-BR');
const token=location.pathname.split('/').filter(Boolean).pop();
// Medição anônima do acompanhamento: um número aleatório do aparelho (sem nome, telefone ou IP),
// tempo com a página visível e tempo assistindo ao vivo. Enviado a cada 30 s e ao sair da página.
const fpStats=(()=>{
 const rid=()=>{try{return crypto.randomUUID()}catch{const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)}};
 let visitor;try{visitor=localStorage.getItem('fp_visitor');if(!/^[0-9a-f-]{36}$/.test(visitor||'')){visitor=rid();localStorage.setItem('fp_visitor',visitor)}}catch{visitor=rid()}
 const visit=rid(),ua=navigator.userAgent||'';
 const device=/iPad|Tablet/i.test(ua)?'tablet':/Mobi|Android|iPhone/i.test(ua)?'mobile':/Windows|Macintosh|Linux|CrOS/i.test(ua)?'desktop':'other';
 const source=/whatsapp/i.test(document.referrer)?'whatsapp':document.referrer?'other':'direct';
 let visible=0,live=0,lastSent=-1;
 const url='/api/public/orders/'+encodeURIComponent(token)+'/visit';
 const body=()=>JSON.stringify({visit,visitor,visible,live,device,source});
 const send=beacon=>{if(lastSent===visible+live*100000&&beacon)return;lastSent=visible+live*100000;try{if(beacon&&navigator.sendBeacon){navigator.sendBeacon(url,new Blob([body()],{type:'application/json'}));return}fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body(),keepalive:true}).catch(()=>{})}catch{}};
 setInterval(()=>{if(document.hidden)return;visible++;const v=window.__fpLiveVideo;if(v&&v.isConnected&&!v.paused&&!v.ended&&v.readyState>=3)live++;if(visible%30===0)send(false)},1000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)send(true)});
 addEventListener('pagehide',()=>send(true));
 send(false);
 return{visitor,event:kind=>{try{fetch('/api/public/orders/'+encodeURIComponent(token)+'/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,visitor}),keepalive:true}).catch(()=>{})}catch{}}};
})();
document.addEventListener('click',e=>{if(e.target.closest?.('#talkStore'))fpStats.event('talk_store')});
let updating=false,lastHtml='',lastStepKey='';const openSteps=new Set();
const NICHE={electronics:{label:'Assistência técnica',noun:'Seu aparelho',live:'Seu aparelho na bancada'},automotive:{label:'Oficina automotiva',noun:'Seu veículo',live:'Seu veículo ao vivo'},carwash:{label:'Lava-jato',noun:'Seu veículo',live:'Seu veículo ao vivo'},pet:{label:'Pet shop',noun:'Seu pet',live:'Seu pet ao vivo'},food:{label:'Alimentação',noun:'Seu pedido',live:'Seu pedido ao vivo'},general:{label:'Serviços',noun:'Seu pedido',live:'Ao vivo agora'}};
const nicheOf=p=>NICHE[p.niche]||NICHE.general;
const talk=p=>{const a=document.getElementById('talkStore');if(!a)return;if(!p.store_whatsapp){a.hidden=true;return;}a.href='https://wa.me/'+p.store_whatsapp+'?text='+encodeURIComponent('Olá! Estou acompanhando meu pedido'+(p.order_number?' '+p.order_number:'')+' pelo Ficou Pronto e queria falar com vocês.');a.hidden=false};
const photoUrl=id=>'/api/public/orders/'+encodeURIComponent(token)+'/photos/'+encodeURIComponent(id);
const arrivalPhotos=p=>{const ids=Array.isArray(p.photos)?p.photos:[];if(!ids.length)return '';return '<section class="arrival"><span>Como '+safe(subject(p).replace(/^Seu /,'seu '))+' chegou na loja</span><div class="arrival-row">'+ids.map(id=>'<a href="'+photoUrl(id)+'" target="_blank" rel="noopener"><img src="'+photoUrl(id)+'" alt="Foto registrada na entrada" loading="lazy"></a>').join('')+'</div></section>'};
const subject=p=>{if(p.item_name)return String(p.item_name).trim();const item=[p.item_brand,p.item_model].filter(Boolean).join(' ').trim();return item?'Seu '+item:nicheOf(p).noun};
function headline(p,steps){
 const s=subject(p),i=Number(p.step_index)||0,step=steps[i]||'';
 if(p.status==='completed')return {h:s+' ficou pronto!',sub:'Pode buscar na loja.',chip:'Pronto',cls:'ok'};
 if(p.status==='queued')return {h:s+' está na fila',sub:'O atendimento começa em breve. Quando começar, esta página mostra a etapa ao vivo.',chip:'Na fila',cls:''};
 if(p.status==='paused')return {h:'Atendimento pausado',sub:s+' está parado em '+low(step)+'. Já já continua.',chip:'Pausado',cls:'pause'};
 if(i>=steps.length-1)return {h:s+' está na última etapa',sub:cap(step)+'. Falta pouco.',chip:'Etapa '+(i+1)+' de '+steps.length,cls:''};
 return {h:s+' está em '+low(step),sub:'Você é avisado quando ficar pronto.',chip:'Etapa '+(i+1)+' de '+steps.length,cls:''};
}
function topBar(p){
 const initials=String(p.store||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toLocaleUpperCase('pt-BR')).join('');
 document.getElementById('storeTop').innerHTML='<span class="store-mark">'+(p.logo_url?'<img alt="" src="'+safe(p.logo_url)+'">':safe(initials))+'</span><div><b>'+safe(cap(p.store||'Estabelecimento'))+'</b><span>'+safe(nicheOf(p).label)+'</span></div>';
 const wm=document.getElementById('wordmark'),done=p.status==='completed';
 wm.classList.toggle('done',done);wm.querySelector('.mark').textContent=done?'!':'?';
 wm.setAttribute('aria-label',done?'Ficou pronto!':'Ficou pronto?');
 document.title=(done?'Ficou pronto! ':'')+(p.store?cap(p.store)+' | ':'')+'Acompanhe seu pedido';
}
const PAW='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="9" r="2.2"/><circle cx="10" cy="5.5" r="2.2"/><circle cx="14" cy="5.5" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M12 11c-3 0-6 3.5-6 6 0 1.7 1.3 2.5 2.8 2.5 1.2 0 2.2-.6 3.2-.6s2 .6 3.2.6c1.5 0 2.8-.8 2.8-2.5 0-2.5-3-6-6-6z"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
const demoSrc=p=>typeof p.demo_video==='string'&&/^\/demo\/[\w/-]+\.mp4$/.test(p.demo_video)?p.demo_video:'';
const aheadOf=p=>{const position=Number(p.queue_position);return position>0?position-1:null};
// Destaque do topo: vídeo ao vivo (etapa), área de espera (fila) ou foto final (pronto).
function heroView(p,steps){
 const idx=Number(p.step_index)||0,step=cap(steps[idx]||'Atendimento'),who=subject(p);
 if(p.status==='completed'){
  const ids=Array.isArray(p.final_photos)?p.final_photos:[];if(!ids.length)return '';

let hlsPlayer=null,liveVideo=null,liveRetryTimer=null,liveGeneration=0,liveRetryDelay=2000,liveFailed=false,hlsLibraryPromise=null;

},3000);
const liveMessage=(video,text)=>{const node=video.parentElement?.querySelector('.nv-live-message');if(node)node.textContent=text;};

}
async function setupLivePlayer(){
