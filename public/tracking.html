<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar pedido | NextVision</title><link rel="stylesheet" href="/ui.css"></head><body><header><strong>◉ NextVision</strong></header><main class="tracking"><section class="card"><p class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.1em">Acompanhamento de serviço</p><h1>Acompanhe seu pedido</h1><div id="tracking">Carregando...</div></section><p class="muted">A transmissão de vídeo estará disponível após a integração das câmeras.</p></main><script>const box=document.getElementById('tracking');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{let t=location.pathname.split('/').pop(),r=await fetch('/api/public/orders/'+encodeURIComponent(t),{cache:'no-store'});if(!r.ok)throw Error('Pedido não encontrado');let p=await r.json();box.innerHTML='<h2>'+safe(p.store)+'</h2><p>'+safe(p.process)+'</p><div class="card" style="background:#f5f8ff;padding:14px"><b>Status:</b> '+safe(({queued:'Na fila',live:'Em atendimento',paused:'Pausado',completed:'Finalizado'})[p.status])+'</div>'+(p.status==='queued'?'<p>Posição na fila: '+Number(p.queue_position)+'</p>':'')+'<h3>Etapas do pedido</h3><ol>'+p.steps.map((s,i)=>'<li>'+safe(s)+' — '+(p.status==='completed'||i<p.step_index?'Concluída':i===p.step_index&&p.status==='live'?'Em andamento':'Aguardando')+'</li>').join('')+'</ol><div class="card" style="background:#f8fafc"><b>Vídeo do serviço</b><p class="muted">A transmissão ao vivo e os replays serão disponibilizados quando a câmera desta etapa estiver conectada.</p></div>'; }catch(e){box.textContent=e.message;}}load();setInterval(load,10000);</script></body></html>
