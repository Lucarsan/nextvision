<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contato · Ficou Pronto</title>
<meta name="description" content="Fale com o Ficou Pronto pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/home.css?v=12">
</head>
<body>
<header class="st-head">
  <a class="fp-wordmark" href="/" aria-label="Ficou Pronto, página inicial">ficou<span class="p">pronto</span></a>
  <nav class="st-nav" aria-label="Páginas"><a href="/como-funciona">Como funciona</a><a href="/segmentos">Segmentos</a><a href="/privacidade">Privacidade</a><a href="/lojas">Lojas</a><a href="/planos">Planos</a><a href="/fale-conosco" aria-current="page">Contato</a></nav>
  <a class="en-btn" href="/#entrar">Entrar</a>
</header>
<main class="st-main">
<h1>Solicite agora um orçamento</h1>
<p class="st-lead">Respondemos em até 15 minutos.</p>
<div class="st-cols" style="border:0">
  <form class="st-form" id="contactForm" style="border:0;padding:0">
    <label>Nome da loja<input id="cStore" required autocomplete="organization"></label>
    <label>Seu nome<input id="cName" autocomplete="name"></label>
    <label>Ramo<select id="cKind"><option>Pet shop · banho e tosa</option><option>Assistência técnica</option><option>Oficina ou funilaria</option><option>Estética automotiva</option><option>Outro</option></select></label>
    <button class="en-btn" type="submit">Solicitar orçamento pelo WhatsApp</button>
    <p class="en-error" id="cError" role="alert"></p>
  </form>
  <div class="st-side" style="border:0;padding:0">
    <div><h2>WhatsApp</h2><p id="cPhone">Carregando…</p></div>
    <div><h2>Atendimento</h2><p>Fortaleza e região.</p></div>
    <div><h2>Já é cliente?</h2><p>Use o "Suporte" dentro do painel da loja.</p></div>
  </div>
</div>
</main>
<footer class="en-foot"><span>© <span id="year"></span> Ficou Pronto · Fortaleza, CE</span><a href="/fale-conosco">Fale com a gente</a></footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();
(()=>{const $=id=>document.getElementById(id);let wa='';
fetch('/api/public/contact').then(r=>r.ok?r.json():{}).then(c=>{wa=c.sales_whatsapp||'';$('cPhone').innerHTML=wa?'<a href="https://wa.me/'+wa+'" target="_blank" rel="noopener">+'+wa.replace(/^(\d{2})(\d{2})(\d{4,5})(\d{4})$/,'$1 $2 $3-$4')+'</a>':'Em breve.'}).catch(()=>{$('cPhone').textContent='Em breve.'});
$('contactForm').addEventListener('submit',e=>{e.preventDefault();if(!wa){$('cError').textContent='O WhatsApp comercial ainda não está disponível.';return}
const t='Olá! Quero um orçamento do Ficou Pronto.\nLoja: '+$('cStore').value.trim()+($('cName').value.trim()?'\nNome: '+$('cName').value.trim():'')+'\nRamo: '+$('cKind').value;
const w=window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(t),'_blank','noopener');if(!w)location.href='https://wa.me/'+wa+'?text='+encodeURIComponent(t)})})();</script>
</body>
</html>
