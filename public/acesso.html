<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#17181d;--text:#2e2f35;--muted:#6b6b70;--bg:#f5f4f0;--line:#e3e1da;--gold:#b8923a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;font:14px/1.5 Inter,system-ui,Arial,sans-serif;color:var(--text);background:var(--bg)}
  .brand{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:56px 64px}
  .wm b{display:block;font:600 46px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.2em}
  .wm i{display:block;font-style:normal;font-size:12px;font-weight:600;letter-spacing:.34em;color:var(--gold);margin-top:10px}
  .wm img{max-width:260px;max-height:90px;display:block}
  .pitch{margin-top:auto;margin-bottom:auto}
  .pitch h2{font:500 30px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 10px}
  .pitch p{margin:0;color:#c9c7c2;max-width:380px}
  .by{font-size:12px;color:#8d8b87}
  .form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
  form{width:100%;max-width:380px}
  h1{margin:0;font-size:24px;font-weight:600;color:var(--ink)}
  .muted{color:var(--muted);margin:6px 0 22px}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px}
  input{display:block;width:100%;height:44px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;font:inherit;color:var(--ink)}
  input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
  button{width:100%;height:46px;border:0;border-radius:8px;background:var(--ink);color:#fff;font:600 15px Inter,sans-serif;cursor:pointer;margin-top:4px}
  button:disabled{opacity:.6}
  .err{color:#8f3f30;font-weight:600;min-height:20px;margin:12px 0 0}
  .help{font-size:12px;color:var(--muted);margin-top:18px}
  @media (max-width:820px){body{grid-template-columns:1fr}.brand{padding:28px 24px}.wm b{font-size:32px}.pitch{margin:28px 0 8px}.pitch h2{font-size:24px}.by{display:none}}
</style>
</head>
<body>
<aside class="brand">
  <div class="wm" id="wm"><b id="wmName"></b><i id="wmSub"></i></div>
  <div class="pitch"><h2 id="pitchTitle">Sistema da rede</h2><p>Caixa, cupom fiscal, estoque, clientes e metas de todas as unidades, num só lugar.</p></div>
  <div class="by">FicouPronto</div>
</aside>
<main class="form">
  <form id="loginForm">
    <h1>Entrar</h1>
    <p class="muted">Gestão e supervisão: entre com o seu e-mail e senha.</p>
    <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
    <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="loginBtn">Entrar</button>
    <p class="err" id="loginError" role="alert"></p>
    <p class="help">Esqueceu a senha? Fale com o suporte FicouPronto pelo WhatsApp.</p>
  </form>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const panelFor = role => role === 'master' ? '/central.html' : role === 'technician' ? '/tecnico.html' : role === 'network' ? '/rede.html' : '/loja.html';
  fetch('/api/public/brand').then(r => r.ok ? r.json() : null).then(b => {
    const name = b?.network ? b.name : 'Ficou Pronto';
    document.title = 'Entrar | ' + name;
    $('pitchTitle').textContent = 'Sistema da rede ' + name.split(/\s+/)[0];
    if (b?.network && /^https:\/\//.test(b.logo_url || '')) { const img = document.createElement('img'); img.src = b.logo_url; img.alt = name; $('wm').replaceChildren(img); }
    else { const [first, ...rest] = name.trim().split(/\s+/); $('wmName').textContent = first.toUpperCase(); $('wmSub').textContent = rest.join(' ').toUpperCase(); }
    if (b?.network && /^#[0-9a-f]{6}$/i.test(b.brand_color || '')) document.documentElement.style.setProperty('--gold', b.brand_color);
  }).catch(() => {});
  setTimeout(() => $('email').focus(), 30);
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('loginBtn'); btn.disabled = true; $('loginError').textContent = '';
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw Error(data.error || 'Não foi possível entrar');
      sessionStorage.setItem('nv_token', data.token);
      location.replace(panelFor(data.user.role));
    } catch (err) { $('loginError').textContent = err.message; btn.disabled = false; }
  });
})();
</script>
</body>
</html>
