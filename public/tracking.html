<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2F3F5"><title>Ficou Pronto | Acompanhe seu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html{background:#F2F3F5}body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#F2F3F5;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 2px}
.store{display:flex;align-items:center;gap:10px;min-width:0}
.store-mark{width:40px;height:40px;border-radius:12px;background:#1F2937;color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;overflow:hidden}
.store-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.store b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.store span{font-size:12px;color:#4B5563}
.wordmark{font-size:15px;font-weight:700;letter-spacing:-.4px;color:#374151;white-space:nowrap}.wordmark .p{color:#F25C1F}.wordmark .mark{color:#F25C1F;display:inline-block;margin-left:1px}
.wordmark.done .mark{animation:pop .6s ease}@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.card{background:#fff;border-radius:20px;padding:18px}
.status-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ref{font-size:12px;color:#4B5563}
h1{margin:2px 0 4px;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.5px}
.sub{margin:0;font-size:13px;color:#4B5563}
.chip{font-size:12px;font-weight:600;color:#C2410C;background:#FFF1EA;padding:5px 10px;border-radius:999px;white-space:nowrap;flex:none}
.chip.ok{color:#047857;background:#ECFDF5}.chip.pause{color:#374151;background:#F3F4F6}
.timeline{list-style:none;margin:16px 0 0;padding:0}
.timeline li{display:flex;gap:12px;align-items:stretch}
.rail{display:flex;flex-direction:column;align-items:center;width:22px;flex:none}
.dot{width:14px;height:14px;border-radius:50%;margin-top:3px;background:#fff;border:2px solid #D1D5DB;flex:none}
.line{flex:1;width:2px;min-height:18px;background:#E5E7EB}
li.done .dot{background:#F25C1F;border-color:#F25C1F}li.done .line{background:#F25C1F}
li.current .dot{border:4px solid #F25C1F}
.timeline li:last-child .line{display:none}
.step{flex:1;padding-bottom:14px;font-size:14px;color:#6B7280;font-weight:500}
li.done .step{color:#374151}li.current .step{color:#111827;font-weight:700}
.step small{display:block;font-size:12px;color:#4B5563;font-weight:500;margin-top:2px}
.live{background:#111827;border-radius:20px;overflow:hidden;color:#fff}
.live-box{position:relative;background:#1F2937;aspect-ratio:16/10;display:grid;place-items:center}
.live-box video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.badge{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;background:rgba(17,24,39,.78);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
.badge i{width:8px;height:8px;border-radius:50%;background:#EF4444;display:block}
.live-foot{padding:12px 16px;display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600}
.live-foot .nv-live-message{font-size:12px;color:#D1D5DB;font-weight:500;text-align:right}
.no-video{padding:22px 18px;font-size:13px;color:#D1D5DB;text-align:center}
.queue{display:flex;align-items:center;gap:14px}
.queue-num{font-size:40px;font-weight:500;letter-spacing:-1.5px;line-height:1}
.queue b{display:block;font-size:14px}.queue span{font-size:12px;color:#4B5563}
.others{margin-top:14px;border-top:1px solid #ECEDF0;padding-top:12px;font-size:13px;color:#374151}
.others p{margin:6px 0}.others .muted{color:#4B5563;font-size:12px}
.qdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#F25C1F;margin-right:6px}
h2{margin:0 0 10px;font-size:15px;font-weight:600}
.rec a{display:inline-flex;margin-top:8px;font-size:13px;font-weight:600;color:#C2410C}
.rec video{width:100%;border-radius:12px;margin-top:8px;background:#000}
.loyalty .bar{height:8px;background:#F2F3F5;border-radius:999px;overflow:hidden;margin:10px 0}.loyalty .bar div{height:100%;background:#F25C1F;border-radius:999px}
.loyalty p{margin:6px 0;font-size:13px;color:#374151}
button.primary{height:46px;padding:0 18px;border:0;border-radius:12px;background:#F25C1F;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.coupon{margin-top:10px;background:#FFF1EA;border-radius:12px;padding:12px}.coupon code{font-size:22px;font-weight:700;letter-spacing:2px}
.foot{display:flex;flex-direction:column;gap:10px;align-items:stretch;padding:4px 2px}
#updated{font-size:12px;color:#4B5563;text-align:center}
#refresh{height:46px;border-radius:12px;border:1px solid #E5E7EB;background:#fff;color:#111827;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.error{background:#FEF2F2;color:#B91C1C;border-radius:14px;padding:14px;font-size:14px}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:#374151;margin-top:6px}
</style></head><body><main><div class="top"><div class="store" id="storeTop"><span class="store-mark">·</span><div><b>Carregando…</b><span>&nbsp;</span></div></div><span class="wordmark" id="wordmark" aria-label="Ficou Pronto">ficou<span class="p">pronto</span><span class="mark">?</span></span></div><div id="content" aria-live="polite" style="display:flex;flex-direction:column;gap:12px"><div class="card">Carregando informações…</div></div><div class="foot"><span id="updated">Atualização automática a cada 15 segundos</span><button id="refresh" type="button">Atualizar agora</button></div></main>
<script>
const content=document.getElementById('content'),updated=document.getElementById('updated'),refresh=document.getElementById('refresh');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>{s=String(s??'').trim();return s?s[0].toLocaleUpperCase('pt-BR')+s.slice(1):s};
const low=s=>String(s??'').trim().toLocaleLowerCase('pt-BR');
const token=location.pathname.split('/').filter(Boolean).pop();
let updating=false,lastHtml='',lastStepKey='';const openSteps=new Set();
const NICHE={electronics:{label:'Assistência técnica',noun:'Seu aparelho',live:'Seu aparelho na bancada'},automotive:{label:'Oficina automotiva',noun:'Seu veículo',live:'Seu veículo ao vivo'},carwash:{label:'Lava-jato',noun:'Seu veículo',live:'Seu veículo ao vivo'},pet:{label:'Pet shop',noun:'Seu pet',live:'Seu pet ao vivo'},food:{label:'Alimentação',noun:'Seu pedido',live:'Seu pedido ao vivo'},general:{label:'Serviços',noun:'Seu pedido',live:'Ao vivo agora'}};
const nicheOf=p=>NICHE[p.niche]||NICHE.general;
const subject=p=>{const item=[p.item_brand,p.item_model].filter(Boolean).join(' ').trim();return item?'Seu '+item:nicheOf(p).noun};
function headline(p,steps){
 const s=subject(p),i=Number(p.step_index)||0,step=steps[i]||'';
 if(p.status==='completed')return {h:s+' ficou pronto!',sub:'Pode retirar na loja.',chip:'Pronto',cls:'ok'};
 if(p.status==='queued')return {h:s+' está na fila',sub:'O atendimento começa em breve. Esta página atualiza sozinha.',chip:'Na fila',cls:''};
 if(p.status==='paused')return {h:'Atendimento pausado',sub:s+' está parado em '+low(step)+'. Já já continua.',chip:'Pausado',cls:'pause'};
 if(i>=steps.length-1)return {h:s+' está na última etapa',sub:cap(step)+'. Falta pouco.',chip:'Etapa '+(i+1)+' de '+steps.length,cls:''};
 return {h:s+' está em '+low(step),sub:'Você é avisado quando ficar pronto.',chip:'Etapa '+(i+1)+' de '+steps.length,cls:''};
}
function topBar(p){
 const initials=String(p.store||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toLocaleUpperCase('pt-BR')).join('');
 document.getElementById('storeTop').innerHTML='<span class="store-mark">'+(p.logo_url?'<img alt="" src="'+safe(p.logo_url)+'">':safe(initials))+'</span><div><b>'+safe(cap(p.store||'Estabelecimento'))+'</b><span>'+safe(nicheOf(p).label)+'</span></div>';
 const wm=document.getElementById('wordmark'),done=p.status==='completed';
 wm.classList.toggle('done',done);wm.querySelector('.mark').textContent=done?'!':'?';
 wm.setAttribute('aria-label',done?'Ficou pronto!':'Ficou pronto?');
 document.title=(done?'Ficou pronto! ':'')+(p.store?cap(p.store)+' | ':'')+'Acompanhe seu pedido';
}
function queueView(p){
 if(p.status!=='queued')return '';
 const position=Number(p.queue_position),ahead=position>0?position-1:null,services=Array.isArray(p.active_services)?p.active_services:[];
 return '<section class="card"><h2>Sua vez na fila</h2><div class="queue"><span class="queue-num">'+(ahead===null?'–':ahead)+'</span><div><b>'+(ahead===1?'pedido na sua frente':'pedidos na sua frente')+'</b><span>'+(position>0?'Você é o '+position+'º da fila':'Aguardando atualização da fila')+'</span></div></div>'+
 '<div class="others"><strong>Atendimento em execução</strong>'+(services.length?services.map(x=>'<p><span class="qdot"></span>'+safe(cap(x.step_name||'Em atendimento'))+' <span class="muted">· etapa '+(Number(x.step_index)+1)+' de '+Number(x.total_steps)+(x.status==='paused'?' · pausado':'')+'</span></p>').join(''):'<p class="muted">Nenhum atendimento em execução no momento.</p>')+'<p class="muted">Dados e vídeos de outros clientes não são exibidos.</p></div></section>';
}
function liveView(p){
 if(p.status!=='live')return '';
 if(!p.camera_id)return '';
 if(p.camera_available===false)return '<section class="live"><div class="no-video">A câmera desta etapa está temporariamente indisponível.</div></section>';
 return '<section class="live"><div class="live-box"><video class="nv-live-player" data-live="1" muted autoplay playsinline controls preload="none"></video><span class="badge"><i></i>Ao vivo</span></div><div class="live-foot"><span>'+safe(nicheOf(p).live)+'</span><span class="nv-live-message" role="status">Carregando vídeo autorizado…</span></div></section>';
}
function render(p){
 const steps=Array.isArray(p.steps)?p.steps:[],idx=Number(p.step_index)||0,head=headline(p,steps);
 const loyalty=!!p.loyalty_enabled&&p.loyalty_checkins!==null&&p.loyalty_checkins!==undefined;
 const history=Array.isArray(p.loyalty_history)?p.loyalty_history:[];
 const claimable=loyalty&&Number(p.loyalty_checkins)>=Number(p.loyalty_target)&&!history.some(h=>h.status==='issued');
 const recs=(p.recordings||[]).filter(r=>r.status==='ready'&&r.download_url);
 const timeline='<ol class="timeline">'+steps.map((step,i)=>{const done=p.status==='completed'||(p.status!=='queued'&&i<idx),cur=!done&&p.status!=='queued'&&i===idx;return '<li class="'+(done?'done':cur?'current':'')+'"><span class="rail"><span class="dot"></span><span class="line"></span></span><span class="step">'+safe(cap(step))+(cur?'<small>'+(p.status==='paused'?'pausado':'agora')+'</small>':'')+'</span></li>'}).join('')+'</ol>';
 return '<section class="card"><div class="status-head"><div><div class="ref">'+(p.external_reference?'Pedido '+safe(p.external_reference):'Seu pedido')+(p.process?' · '+safe(cap(p.process)):'')+'</div><h1>'+safe(head.h)+'</h1><p class="sub">'+safe(head.sub)+'</p></div><span class="chip '+head.cls+'">'+safe(head.chip)+'</span></div>'+timeline+'</section>'+
 liveView(p)+queueView(p)+
 (recs.length?'<section class="card rec"><h2>Vídeos das etapas</h2>'+recs.map(r=>'<div><strong>'+safe(cap(steps[Number(r.step_index)]||'Etapa'))+'</strong><video controls preload="metadata" src="'+safe(r.download_url)+'"></video><a href="'+safe(r.download_url)+'" download>Baixar vídeo</a></div>').join('')+'</section>':'')+
 (loyalty?'<section class="card loyalty"><h2>Sua fidelidade</h2><p>Você tem <strong>'+Number(p.loyalty_checkins)+'</strong> de <strong>'+Number(p.loyalty_target)+'</strong> check-ins.</p><div class="bar"><div style="width:'+Math.min(100,Math.round(Number(p.loyalty_checkins)/Math.max(1,Number(p.loyalty_target))*100))+'%"></div></div><p>Recompensa: '+safe(p.loyalty_reward||'Benefício da loja')+'</p>'+(claimable?'<button class="primary" id="claim">Solicitar recompensa</button>':'')+'<div id="couponArea"></div><details><summary>Histórico de recompensas</summary>'+(history.length?history.map(h=>'<p>'+safe(h.reward)+' · '+(h.status==='redeemed'?'Resgatada':'Cupom emitido')+' · '+new Date(h.issued_at).toLocaleDateString('pt-BR')+'</p>').join(''):'<p>Nenhuma recompensa solicitada até agora.</p>')+'</details></section>':'');
}
let hlsPlayer=null,liveVideo=null,liveRetryTimer=null,liveGeneration=0,liveRetryDelay=5000,liveFailed=false,hlsLibraryPromise=null;
let liveProgress={generation:0,frames:null,time:0,at:Date.now()};
setInterval(()=>{
 const video=liveVideo;
 if(!video||!video.isConnected||document.hidden||liveFailed)return;
 const frames=video.getVideoPlaybackQuality?.().totalVideoFrames??null;
 if(liveProgress.generation!==liveGeneration||video.seeking||(video.paused&&!video.ended&&video.readyState>=2)){
  liveProgress={generation:liveGeneration,frames,time:video.currentTime,at:Date.now()};return;
 }
 const progressed=frames===null?video.currentTime>liveProgress.time:frames>liveProgress.frames;
 if(progressed){liveProgress={generation:liveGeneration,frames,time:video.currentTime,at:Date.now()};return;}
 if(Date.now()-liveProgress.at>15000){if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null;}retryLive(video,'A imagem parou de receber novos quadros.');}
},3000);
const liveMessage=(video,text)=>{const node=video.parentElement?.querySelector('.nv-live-message');if(node)node.textContent=text;};
function retryLive(video,message){
 liveFailed=true;
 if(!video.isConnected)return;
 const delay=liveRetryDelay;liveRetryDelay=Math.min(30000,delay*2);
 liveMessage(video,message+' Reconectando em '+Math.round(delay/1000)+' segundos…');
 clearTimeout(liveRetryTimer);
 liveRetryTimer=setTimeout(()=>{liveRetryTimer=null;if(video.isConnected&&!document.hidden)void setupLivePlayer();},delay);
}
async function setupLivePlayer(){
 const video=content.querySelector('video.nv-live-player'),generation=++liveGeneration;
 clearTimeout(liveRetryTimer);liveRetryTimer=null;
 if(hlsPlayer){hlsPlayer.destroy();hlsPlayer=null}
 if(liveVideo){liveVideo.onerror=null;liveVideo.onplaying=null;liveVideo.onended=null;if(liveVideo!==video){liveVideo.pause();liveVideo.removeAttribute('src');liveVideo.load();}}
 liveVideo=video;liveFailed=false;
 if(!video)return;
 const src='/api/public/orders/'+encodeURIComponent(token)+'/live/index.m3u8';
 liveMessage(video,'Conectando à transmissão autorizada…');
 video.onended=()=>{if(generation===liveGeneration)retryLive(video,'A transmissão foi interrompida.');};
 video.onplaying=()=>{if(generation===liveGeneration){liveRetryDelay=5000;liveFailed=false;liveMessage(video,'Ao vivo');}};
 if(video.canPlayType('application/vnd.apple.mpegurl')){
  video.onerror=()=>{if(generation===liveGeneration)retryLive(video,'Transmissão temporariamente indisponível.');};
  video.src=src;video.play().catch(()=>{});return;
 }
 if(!window.Hls){
  if(!hlsLibraryPromise)hlsLibraryPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js';script.onload=resolve;script.onerror=()=>{script.remove();hlsLibraryPromise=null;reject(Error('Player unavailable'));};document.head.appendChild(script);});
  try{await hlsLibraryPromise}catch{if(generation===liveGeneration)retryLive(video,'Não foi possível carregar o player.');return;}
 }
 if(!video.isConnected||generation!==liveGeneration)return;
 if(!window.Hls?.isSupported()){liveMessage(video,'Reprodução de vídeo não suportada neste navegador.');return;}
 const player=new Hls({enableWorker:true,lowLatencyMode:true});hlsPlayer=player;
 player.on(Hls.Events.MANIFEST_PARSED,()=>{if(generation===liveGeneration)video.play().catch(()=>{});});
 player.on(Hls.Events.FRAG_BUFFERED,()=>{if(generation===liveGeneration){liveMessage(video,'Ao vivo');liveRetryDelay=5000;}});
 player.on(Hls.Events.ERROR,(_event,data)=>{
  if(generation!==liveGeneration)return;
  if(!data.fatal){if(data.type===Hls.ErrorTypes.NETWORK_ERROR)liveMessage(video,'Conexão instável. Reconectando…');return;}
  const status=data.response?.code||data.networkDetails?.status||0;
  const message=status===404?'Aguardando câmera autorizada.':status===409?'Câmera ocupada por outro pedido.':status===503?'Transmissão ainda não configurada.':status===502?'Origem do vídeo indisponível.':status===429?'Aguardando liberação de novas requisições.':'Conexão de vídeo interrompida.';
  player.destroy();if(hlsPlayer===player)hlsPlayer=null;retryLive(video,message);
 });
 player.loadSource(src);player.attachMedia(video);
}
function showCoupon(){const v=sessionStorage.getItem('nv_coupon_'+token),area=document.getElementById('couponArea');if(!v||!area)return;area.innerHTML='<div class="coupon"><div class="small muted">Apresente este código à loja</div><code>'+safe(v)+'</code><p class="small muted">Guarde o cupom até a validação.</p></div>'}
async function load(){if(updating||document.hidden)return;updating=true;refresh.disabled=true;try{const r=await fetch('/api/public/orders/'+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)throw Error(r.status===404?'Pedido não encontrado. Confira o link recebido.':'Não foi possível consultar este pedido.');const p=await r.json();topBar(p);const html=render(p);if(html!==lastHtml){content.innerHTML=html;lastHtml=html;void setupLivePlayer();const key=p.status+':'+p.step_index;if(key!==lastStepKey){lastStepKey=key;openSteps.clear();if(p.status!=='completed')openSteps.add(Number(p.step_index));content.querySelectorAll('.step-panel').forEach(el=>{el.open=Number(el.dataset.step)===Number(p.step_index)&&p.status!=='completed'})}else{content.querySelectorAll('.step-panel').forEach(el=>{el.open=openSteps.has(Number(el.dataset.step))})}const claim=document.getElementById('claim');if(claim)claim.onclick=async()=>{claim.disabled=true;try{const result=await fetch('/api/public/orders/'+encodeURIComponent(token)+'/loyalty/claim',{method:'POST'});const data=await result.json();if(!result.ok)throw Error(data.error||'Não foi possível solicitar a recompensa');sessionStorage.setItem('nv_coupon_'+token,data.code);showCoupon()}catch(e){claim.insertAdjacentHTML('afterend','<p class="error">'+safe(e.message)+'</p>');claim.disabled=false}};showCoupon();content.querySelectorAll('.step-panel').forEach(el=>el.addEventListener('toggle',()=>{const i=Number(el.dataset.step);if(el.open)openSteps.add(i);else openSteps.delete(i)}))}updated.textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · atualização automática a cada 15 segundos'}catch(e){if(!lastHtml)content.innerHTML='<div class="error">'+safe(e.message)+'</div>';updated.textContent='Falha na atualização. Tente novamente.'}finally{updating=false;refresh.disabled=false}}
refresh.addEventListener('click',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();if(liveFailed&&liveVideo?.isConnected)void setupLivePlayer();}});load();setInterval(load,15000);
</script></body></html>
